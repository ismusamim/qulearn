services:
  db:
    image: postgres:16-alpine
    container_name: qulearn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qulearn
      POSTGRES_PASSWORD: qulearn
      POSTGRES_DB: qulearn
    ports:
      - "127.0.0.1:55470:5432"
    volumes:
      - qulearn-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qulearn -d qulearn"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qulearn-db:
